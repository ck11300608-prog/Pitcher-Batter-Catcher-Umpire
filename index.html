<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 棒球轉播賽 - MLB Broadcast Pitcher Showdown</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        arcade: {
                            bg: '#050811',
                            panel: '#0e1626',
                            card: '#162238',
                            accent: '#00f2fe',
                            gold: '#ffb703',
                            pink: '#ff0055',
                            green: '#10b981'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .broadcast-glass {
            background: rgba(10, 16, 30, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .broadcast-banner-gradient {
            background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(30,58,138,0.9) 100%);
        }
        .pulse-target {
            animation: pulseGlow 1.2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.92); opacity: 0.85; }
            100% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 22px #00f2fe; }
        }
        @keyframes tvPopup {
            0% { transform: translateY(-30px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .tv-popup-anim {
            animation: tvPopup 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
